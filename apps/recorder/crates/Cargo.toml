[workspace]
resolver = "3"
members = ["ax", "scrape", "timeline", "video", "probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
recordem-ax = { path = "ax" }
recordem-scrape = { path = "scrape" }
recordem-timeline = { path = "timeline" }
recordem-video = { path = "video" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
