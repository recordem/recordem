[package]
name = "recordem-recorder"
version = "0.2.0"
edition = "2024"
description = "Recordem for the Mac: notices calls, records them through recordem-desktop and sends them to a Recordem server"
license = "MIT"

[lib]
name = "recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Recording is the engine's, through recordem-desktop (the Desktop SDK's executable, a sidecar of this app): the app is
# its first host, on the same path any other app takes.
recordem-desktop = { path = "../desktop-client" }

tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
